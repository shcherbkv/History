<article class="article-content">
  <h1>Олег Вещий</h1>
  <section class="text-block">
    <figure class="article-image float-left">
      <img src="assets/images/content/history/rulers/oleg.jpg" alt="Олег Вещий">
      <figcaption>Олег Вещий. Миниатюра.</figcaption>
    </figure>
    <p>Олег, прозванный Вещим, — регент при малолетнем Игоре, объединивший Новгород и Киев в 882 году. По преданию, он прибил щит к вратам Константинополя, показывая победу над Византией.</p>
    <p>Легенда о его смерти от коня стала одной из самых известных в русской истории.</p>
  </section>
</article>
